name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # нужно только для комментария с ошибками сборки к коммиту

jobs:
  lab-app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: testbeds/lab-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # lab-app не зависит от vulscan-kit — это цель для сканера, а не его компонент,
      # поэтому отдельного шага публикации кита в Maven Local здесь нет.
      - name: Build and test
        shell: bash
        run: ./gradlew build bootJar --stacktrace 2>&1 | tee build.log
      - name: Report failure as commit comment
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +o pipefail
          {
            echo "CI failed. Key lines:"
            echo '```'
            grep -E "^e: |^w: .*Unresolved|FAILED|error:|Unresolved|Could not|AssertionError|Expecting|Caused by|Exception" build.log | head -60
            echo '```'
            echo "Log tail:"
            echo '```'
            tail -n 60 build.log
            echo '```'
          } | head -c 60000 > failure.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@failure.md
