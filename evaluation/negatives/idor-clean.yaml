# Негативная цель IDOR (план, E-2.4): lab-app-clean, те же 6 ресурсов (orders×3, documents×2,
# admin/users×1), что в scenarios/idor.yaml для IDOR-01..08, но профиль clean
# (io.vulscan.lab.clean.CleanIdorController) — с проверкой владения/роли. Безопасные/публичные/
# «шумовые» случаи здесь не повторяются — они не относятся к «той же уязвимости на безопасной цели».
module: IDOR
target:
  name: idor-clean-eval
  baseUrl: http://lab-app-clean:8080
endpoints:
  - method: GET
    url: http://lab-app-clean:8080/api/orders/{id}
    idempotent: true
    parameters: [{ name: id, location: PATH, sampleValue: "1001" }]
  - method: GET
    url: http://lab-app-clean:8080/api/documents/{id}
    idempotent: true
    parameters: [{ name: id, location: PATH, sampleValue: "2001" }]
  - method: GET
    url: http://lab-app-clean:8080/api/admin/users
    idempotent: true
    parameters: []

identities:
  - { label: alice, role: USER, loginUrl: "http://lab-app-clean:8080/login", username: alice, password: alice-pass-1 }
  - { label: bob, role: USER, loginUrl: "http://lab-app-clean:8080/login", username: bob, password: bob-pass-1 }
  - { label: admin, role: ADMIN, loginUrl: "http://lab-app-clean:8080/login", username: admin, password: admin-pass-1 }

resources:
  - endpoint: "GET http://lab-app-clean:8080/api/orders/{id}"
    idParameter: { name: id, location: PATH }
    idValue: "1001"
    owner: alice
    sensitivity: HIGH
    ownerMarkers: ["$.content"]
    access: [{ identity: bob, expected: DENY }] # CLEAN-IDOR-01: alice->bob
  - endpoint: "GET http://lab-app-clean:8080/api/orders/{id}"
    idParameter: { name: id, location: PATH }
    idValue: "1002"
    owner: bob
    sensitivity: HIGH
    ownerMarkers: ["$.content"]
    access: [{ identity: alice, expected: DENY }] # CLEAN-IDOR-02: bob->alice
  - endpoint: "GET http://lab-app-clean:8080/api/orders/{id}"
    idParameter: { name: id, location: PATH }
    idValue: "1003"
    owner: admin
    sensitivity: HIGH
    ownerMarkers: ["$.content"]
    access:
      - { identity: bob, expected: DENY } # CLEAN-IDOR-03: admin->bob
      - { identity: alice, expected: DENY } # CLEAN-IDOR-04: admin->alice
  - endpoint: "GET http://lab-app-clean:8080/api/documents/{id}"
    idParameter: { name: id, location: PATH }
    idValue: "2002"
    owner: bob
    sensitivity: MEDIUM
    ownerMarkers: ["$.content"]
    access: [{ identity: alice, expected: DENY }] # CLEAN-IDOR-05: bob->alice
  - endpoint: "GET http://lab-app-clean:8080/api/documents/{id}"
    idParameter: { name: id, location: PATH }
    idValue: "2003"
    owner: admin
    sensitivity: MEDIUM
    ownerMarkers: ["$.content"]
    access:
      - { identity: alice, expected: DENY } # CLEAN-IDOR-06: admin->alice
      - { identity: bob, expected: DENY } # CLEAN-IDOR-07: admin->bob
  - endpoint: "GET http://lab-app-clean:8080/api/admin/users"
    idParameter: { name: "-", location: QUERY }
    idValue: "admin-users"
    owner: admin
    sensitivity: HIGH
    ownerMarkers: ["$.users[0].username"]
    access: [{ identity: bob, expected: DENY }] # CLEAN-IDOR-08: admin->bob

options: {}
